apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kbk
spec:
  hostnames:
    - kbk-dev.bubtaylor.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab-gateway
      namespace: istio-ingress
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kbk-service
          port: 80
